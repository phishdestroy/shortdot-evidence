# Runs on the PhishDestroy server runner (tag pd-server, shell executor).
# Daily NetAPI fetch (replaces .github/workflows/update.yml; same steps) and
# GitLab Pages deployment. `fetch` runs from the pipeline schedule (or a manual
# "Run pipeline"); it pushes the update with the job token and hands the fresh
# docs/ to `pages` in the same pipeline.
stages: [fetch, deploy]

fetch:
  stage: fetch
  image: python:3.12
  tags: [pd-server]
  variables:
    GIT_DEPTH: "1"
    TLD_LIST: "icu,bond,cyou,sbs,cfd,buzz,qpon"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - python3 scan/fetch_new.py
    - cp data/index.json docs/chart-data.json
    - python3 docs/build_datajson.py --index data/index.json --ioc ioc/indicators.csv --legit case/LEGITIMATE_SURVEY.md --out docs/data.json
    - |
      git config user.name "PhishDestroy Bot"
      git config user.email "bot@phishdestroy.io"
      git add -A
      if git diff --staged --quiet; then
        echo "Nothing to commit."
        exit 0
      fi
      git commit -m "chore: daily zone update $(date -u +%Y-%m-%d)"
      REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      for i in 1 2 3; do
        git push "$REMOTE" HEAD:main && exit 0
        git pull --rebase -X theirs "$REMOTE" main || true
        sleep $((i * 5))
      done
      exit 1
  artifacts:
    paths: [docs/, ioc/]
    expire_in: 1 day

# GitLab Pages — replaces the former GitHub Pages deployment.
pages:
  stage: deploy
  image: alpine:3.20
  tags: [pd-server]
  variables:
    GIT_DEPTH: "1"
  needs:
    - job: fetch
      optional: true
  script:
    - rm -rf public && cp -r docs public
    - cp -r ioc public/ioc
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
