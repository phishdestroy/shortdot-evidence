name: Daily Zone Update

on:
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Full-zone backfill first (after a feed outage; see scan/backfill_zone.py)'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize scheduled and manual writes to the zone archive.
concurrency:
  group: daily-zone-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Full-zone downloads (backfill) take far longer than the daily delta.
    timeout-minutes: ${{ inputs.backfill && 120 || 45 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backfill from full zones
        if: ${{ inputs.backfill }}
        env:
          NETAPI_TOKEN: ${{ secrets.NETAPI_TOKEN }}
          TLD_LIST: icu,bond,cyou,sbs,cfd,buzz,qpon
        run: python scan/backfill_zone.py

      - name: Fetch zone data & update stats
        env:
          NETAPI_TOKEN: ${{ secrets.NETAPI_TOKEN }}
          TLD_LIST: icu,bond,cyou,sbs,cfd,buzz,qpon
        run: python scan/fetch_new.py

      - name: Copy index to chart-data for Pages daily feed
        run: cp data/index.json docs/chart-data.json

      - name: Rebuild site data
        run: |
          python docs/build_datajson.py \
            --index data/index.json \
            --ioc ioc/indicators.csv \
            --legit case/LEGITIMATE_SURVEY.md \
            --out docs/data.json

      - name: Commit & push changes
        run: |
          git config user.name 'phishdestroy-bot'
          git config user.email 'bot@phishdestroy.io'
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: daily zone update $(date -u +%Y-%m-%d)"
            # Pages workflow may push docs/data.json meanwhile — rebase onto it and retry.
            git push || (git pull --rebase -X theirs origin main && git push)
          fi
